<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8798AF"/></marker><linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#102D57"/><stop offset="100%" stop-color="#174A83"/></linearGradient></defs>
<rect width="1800" height="1450" fill="#F4F7FB"/>
<rect x="42" y="30" width="1716" height="112" rx="24" fill="url(#head)" stroke="#102D57" stroke-width="0"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="37" fill="#FFFFFF" font-weight="750" text-anchor="start">UNIFIED ADS MANAGEMENT PLATFORM</text><text x="82" y="113" font-family="Inter, Arial, sans-serif" font-size="20" fill="#D8E7FA" font-weight="450" text-anchor="start">One workspace for Google Ads + Meta Ads • campaigns • conversions • reporting • billing</text><rect x="1452" y="67" width="128" height="34" rx="17" fill="#E7F0FF" stroke="#E7F0FF" stroke-width="1"/><text x="1516.0" y="90" font-family="Inter, Arial, sans-serif" font-size="16" fill="#245DB5" font-weight="600" text-anchor="middle">GOOGLE ADS</text><rect x="1594" y="67" width="128" height="34" rx="17" fill="#E6F7F2" stroke="#E6F7F2" stroke-width="1"/><text x="1658.0" y="90" font-family="Inter, Arial, sans-serif" font-size="16" fill="#087E72" font-weight="600" text-anchor="middle">META ADS</text><text x="60" y="188" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2463B7" font-weight="750" text-anchor="start">01  CUSTOMER SETUP</text><text x="60" y="220" font-family="Inter, Arial, sans-serif" font-size="19" fill="#66768C" font-weight="400" text-anchor="start">Start with the customer, connect ad accounts, then configure measurement.</text><rect x="60" y="250" width="500" height="190" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="60" y="250" width="9" height="190" rx="4" fill="#2663C7" stroke="#2663C7" stroke-width="0"/><text x="88" y="290" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">1. Create workspace</text><text x="88" y="322" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">Customer entry</text><circle cx="94" cy="354" r="4.5" fill="#2663C7"/><text x="109" y="360" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Sign up / log in</text><circle cx="94" cy="383" r="4.5" fill="#2663C7"/><text x="109" y="389" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Create workspace and invite team</text><circle cx="94" cy="412" r="4.5" fill="#2663C7"/><text x="109" y="418" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Choose workspace and permissions</text><rect x="650" y="250" width="500" height="190" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="650" y="250" width="9" height="190" rx="4" fill="#087E8B" stroke="#087E8B" stroke-width="0"/><text x="678" y="290" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">2. Connect ad accounts</text><text x="678" y="322" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">OAuth connection</text><circle cx="684" cy="354" r="4.5" fill="#087E8B"/><text x="699" y="360" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Connect Google Ads account(s)</text><circle cx="684" cy="383" r="4.5" fill="#087E8B"/><text x="699" y="389" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Connect Meta Business / ad account</text><circle cx="684" cy="412" r="4.5" fill="#087E8B"/><text x="699" y="418" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Choose accounts and approve permissions</text><rect x="1240" y="250" width="500" height="190" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="1240" y="250" width="9" height="190" rx="4" fill="#7856B8" stroke="#7856B8" stroke-width="0"/><text x="1268" y="290" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">3. Set up conversion tracking</text><text x="1268" y="322" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">Track outcomes on the website</text><circle cx="1274" cy="354" r="4.5" fill="#7856B8"/><text x="1289" y="360" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Google: conversion action + Google tag / GTM</text><circle cx="1274" cy="383" r="4.5" fill="#7856B8"/><text x="1289" y="389" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Meta: Pixel / Dataset + event testing</text><circle cx="1274" cy="412" r="4.5" fill="#7856B8"/><text x="1289" y="418" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Optional later: server-side event integrations</text><line x1="565" y1="345" x2="636" y2="345" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1155" y1="345" x2="1226" y2="345" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="60" y="486" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2463B7" font-weight="750" text-anchor="start">02  UNIFIED WORKSPACE</text><text x="60" y="518" font-family="Inter, Arial, sans-serif" font-size="19" fill="#66768C" font-weight="400" text-anchor="start">Most screens are shared; platform-specific fields and actions stay clearly labelled.</text><rect x="60" y="548" width="500" height="158" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="60" y="548" width="9" height="158" rx="4" fill="#2563EB" stroke="#2563EB" stroke-width="0"/><text x="88" y="588" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">Overview &amp; analytics</text><text x="88" y="620" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">A single performance view</text><circle cx="94" cy="652" r="4.5" fill="#2563EB"/><text x="109" y="658" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Spend, impressions, clicks, conversions</text><circle cx="94" cy="681" r="4.5" fill="#2563EB"/><text x="109" y="687" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Compare by platform and date range</text><rect x="650" y="548" width="500" height="158" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="650" y="548" width="9" height="158" rx="4" fill="#0C8B83" stroke="#0C8B83" stroke-width="0"/><text x="678" y="588" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">Campaign manager</text><text x="678" y="620" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">One campaign list</text><circle cx="684" cy="652" r="4.5" fill="#0C8B83"/><text x="699" y="658" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Search, filter, pause / resume</text><circle cx="684" cy="681" r="4.5" fill="#0C8B83"/><text x="699" y="687" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Edit budgets where the provider allows</text><rect x="1240" y="548" width="500" height="158" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="1240" y="548" width="9" height="158" rx="4" fill="#7957BD" stroke="#7957BD" stroke-width="0"/><text x="1268" y="588" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">Conversion tracking</text><text x="1268" y="620" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">A dedicated measurement area</text><circle cx="1274" cy="652" r="4.5" fill="#7957BD"/><text x="1289" y="658" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Google conversion actions and tag status</text><circle cx="1274" cy="681" r="4.5" fill="#7957BD"/><text x="1289" y="687" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Meta Pixel / Dataset, events and diagnostics</text><rect x="60" y="724" width="500" height="158" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="60" y="724" width="9" height="158" rx="4" fill="#D18A1B" stroke="#D18A1B" stroke-width="0"/><text x="88" y="764" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">Ad groups, ad sets &amp; ads</text><text x="88" y="796" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">Shared navigation, separate editors</text><circle cx="94" cy="828" r="4.5" fill="#D18A1B"/><text x="109" y="834" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Google: campaigns → ad groups → ads</text><circle cx="94" cy="857" r="4.5" fill="#D18A1B"/><text x="109" y="863" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Meta: campaigns → ad sets → ads</text><rect x="650" y="724" width="500" height="158" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="650" y="724" width="9" height="158" rx="4" fill="#0C8B83" stroke="#0C8B83" stroke-width="0"/><text x="678" y="764" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">Creatives &amp; audiences</text><text x="678" y="796" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">Browse together, edit per platform</text><circle cx="684" cy="828" r="4.5" fill="#0C8B83"/><text x="699" y="834" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Creative / asset library and previews</text><circle cx="684" cy="857" r="4.5" fill="#0C8B83"/><text x="699" y="863" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Audiences, targeting and provider-specific rules</text><rect x="1240" y="724" width="500" height="158" rx="18" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/><rect x="1240" y="724" width="9" height="158" rx="4" fill="#2563EB" stroke="#2563EB" stroke-width="0"/><text x="1268" y="764" font-family="Inter, Arial, sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="start">Reports &amp; exports</text><text x="1268" y="796" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7A90" font-weight="500" text-anchor="start">Understand outcomes</text><circle cx="1274" cy="828" r="4.5" fill="#2563EB"/><text x="1289" y="834" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">Conversions, CPA, ROAS and trend reports</text><circle cx="1274" cy="857" r="4.5" fill="#2563EB"/><text x="1289" y="863" font-family="Inter, Arial, sans-serif" font-size="18" fill="#344761" font-weight="400" text-anchor="start">CSV export and data-freshness indicators</text><text x="60" y="930" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2463B7" font-weight="750" text-anchor="start">03  BILLING — KEEP THESE TWO THINGS SEPARATE</text><text x="60" y="960" font-family="Inter, Arial, sans-serif" font-size="19" fill="#66768C" font-weight="400" text-anchor="start">A shared Billing menu can show both, but they represent different payments.</text><rect x="60" y="985" width="800" height="178" rx="18" fill="#FFFFFF" stroke="#C7D9F6" stroke-width="2"/><rect x="60" y="985" width="10" height="178" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/><rect x="90" y="1005" width="245" height="34" rx="17" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="1"/><text x="212.5" y="1028" font-family="Inter, Arial, sans-serif" font-size="16" fill="#245DB5" font-weight="600" text-anchor="middle">YOUR PLATFORM BILLING</text><text x="90" y="1062" font-family="Inter, Arial, sans-serif" font-size="26" fill="#172B4D" font-weight="700" text-anchor="start">Subscription to your SaaS</text><text x="90" y="1096" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52637A" font-weight="400" text-anchor="start">Plan and usage</text><text x="90" y="1122" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52637A" font-weight="400" text-anchor="start">Your invoices and payment method</text><text x="90" y="1148" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52637A" font-weight="400" text-anchor="start">Upgrade, downgrade or cancel plan</text><rect x="900" y="985" width="840" height="178" rx="18" fill="#FFFFFF" stroke="#F1D9AE" stroke-width="2"/><rect x="900" y="985" width="10" height="178" rx="5" fill="#D18A1B" stroke="#D18A1B" stroke-width="0"/><rect x="930" y="1005" width="290" height="34" rx="17" fill="#FFF4DF" stroke="#FFF4DF" stroke-width="1"/><text x="1075.0" y="1028" font-family="Inter, Arial, sans-serif" font-size="16" fill="#9A5C0D" font-weight="600" text-anchor="middle">GOOGLE / META AD BILLING</text><text x="930" y="1062" font-family="Inter, Arial, sans-serif" font-size="26" fill="#172B4D" font-weight="700" text-anchor="start">Advertising spend billed by the platforms</text><text x="930" y="1096" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52637A" font-weight="400" text-anchor="start">Show spend / payment status only where APIs permit</text><text x="930" y="1122" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52637A" font-weight="400" text-anchor="start">Provider payment methods and invoices may need their own portal</text><text x="930" y="1148" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52637A" font-weight="400" text-anchor="start">Never imply the SaaS subscription pays for ad spend</text><text x="60" y="1215" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2463B7" font-weight="750" text-anchor="start">04  BEHIND THE SCENES</text><text x="60" y="1245" font-family="Inter, Arial, sans-serif" font-size="19" fill="#66768C" font-weight="400" text-anchor="start">One user interface, shared services, and separate provider integrations.</text><rect x="60" y="1270" width="310" height="86" rx="16" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><text x="215.0" y="1321" font-family="Inter, Arial, sans-serif" font-size="23" fill="#245DB5" font-weight="700" text-anchor="middle">Web app / UI</text><rect x="445" y="1270" width="420" height="86" rx="16" fill="#EEF7F5" stroke="#EEF7F5" stroke-width="0"/><text x="655.0" y="1321" font-family="Inter, Arial, sans-serif" font-size="23" fill="#087E72" font-weight="700" text-anchor="middle">Shared API + database</text><rect x="955" y="1270" width="785" height="86" rx="16" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><text x="1347.5" y="1321" font-family="Inter, Arial, sans-serif" font-size="23" fill="#245DB5" font-weight="700" text-anchor="middle">Provider adapters: Google Ads API  •  Meta Marketing API</text><line x1="375" y1="1313" x2="430" y2="1313" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="865" y1="1313" x2="940" y2="1313" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="60" y="1400" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52637A" font-weight="500" text-anchor="start">Important: connecting an ad account does not install website tracking automatically. Website / CMS / tag-manager access may be required.</text><text x="1740" y="1400" font-family="Inter, Arial, sans-serif" font-size="15" fill="#7A8AA0" font-weight="650" text-anchor="end">PRODUCT FLOW • v2</text></svg>